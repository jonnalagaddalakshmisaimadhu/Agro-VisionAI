services:
  - type: web
    name: farmiq-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: server
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./farmiq.db
      - key: GEMINI_API_KEY
        value: AIzaSyDCZs0XudZj7lwsCr4Z4dxjBkzyuo5TaeU
      - key: GROQ_API_KEY
        value: gsk_your_actual_key_here
      - key: ALLOWED_ORIGINS
        value: "https://farmiq-agrovisionai.web.app,https://farmiq-agrovisionai.firebaseapp.com,http://localhost:5173"
