# =============================================================================
# Trivy Vulnerability & Container Security Audit Automation (Phase 7)
# Scans Docker images, OS packages, and Python virtual environment dependencies.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-cve-security-audit
  namespace: security-audit
  labels:
    app.kubernetes.io/name: trivy-scanner
    security.farmiq.io/phase: phase7-compliance
spec:
  schedule: "0 2 * * *" # Daily at 02:00 UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: trivy-scanner
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trivy
              image: aquasec/trivy:0.49.1
              imagePullPolicy: IfNotPresent
              args:
                - "image"
                - "--severity"
                - "CRITICAL,HIGH"
                - "--exit-code"
                - "1"
                - "--ignore-unfixed"
                - "--format"
                - "table"
                - "farmiq-backend:production-latest"
              env:
                - name: TRIVY_CACHE_DIR
                  value: "/tmp/trivy-cache"
              resources:
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
                requests:
                  cpu: "250m"
                  memory: "256Mi"
              volumeMounts:
                - mountPath: /var/run/docker.sock
                  name: docker-sock
                  readOnly: true
          volumes:
            - name: docker-sock
              hostPath:
                path: /var/run/docker.sock
