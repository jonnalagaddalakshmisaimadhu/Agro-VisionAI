apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: farmiq-traefik-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - farmiq.ai
        - api.farmiq.ai
      secretName: farmiq-tls-cert
  rules:
    - host: api.farmiq.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: farmiq-backend
                port:
                  number: 8000
    - host: farmiq.ai
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: farmiq-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: farmiq-frontend
                port:
                  number: 80
