apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmiq-backend-deployment
  labels:
    app: farmiq-backend
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: farmiq-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: farmiq-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: farmiq-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: REDIS_URL
              value: "redis://farmiq-redis:6379/0"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "farmiq-redpanda:9092"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: farmiq-db-secret
                  key: database-url
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: farmiq-backend
  labels:
    app: farmiq-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: farmiq-backend
